name: build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # The original executable and overlays live in a private repository that only this
    # repository's own runs can read, so builds from forks are skipped.
    if: >-
      github.repository == 'juandav/dw3_decomp' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # deps: where the version's executable and AAA/PRO are in the
        # dependencies repository. report: upload build/<version>/report.json
        # as <exe>_report, the artifact decomp.dev reads.
        include:
          - version: us
            exe: SLUS_014.36
            deps: .
            report: true
          # no C units yet, so no progress report
          - version: eu
            exe: SLES_039.36
            deps: eu
            report: false
    name: build (${{ matrix.version }})
    env:
      VERSION: ${{ matrix.version }}
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - uses: actions/checkout@v5
      with:
        repository: juandav/dw3_decomp_dependencies
        ssh-key: ${{ secrets.DW3_DEPENDENCIES_SSH_KEY }}
        path: dependencies
        persist-credentials: false

    - run: |
        mkdir -p "disks/$VERSION/AAA"
        cp "dependencies/$DEPS/$EXE" "disks/$VERSION/"
        cp -r "dependencies/$DEPS/AAA/PRO" "disks/$VERSION/AAA/"
        rm -rf dependencies
      env:
        DEPS: ${{ matrix.deps }}
        EXE: ${{ matrix.exe }}

    - run: |
        sudo apt-get update
        sudo apt-get install -y binutils-mipsel-linux-gnu gcc-mipsel-linux-gnu

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    - run: pip install -r requirements.txt

    - run: tools/dl_deps.sh

    # make and the tools take VERSION from the environment
    - run: |
        make generate
        make -j$(nproc)
        make compare

    - if: matrix.report
      run: make report

    - if: matrix.report
      uses: actions/upload-artifact@v6
      with:
        name: ${{ matrix.exe }}_report
        path: build/${{ matrix.version }}/report.json
