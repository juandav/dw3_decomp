name: main
sha1: 444653259f78ddb483fd22af72cce9276f42f214
options:
  basename: main
  target_path: disks/us/SLUS_014.36
  base_path: ..
  platform: psx
  compiler: GCC

  asm_path: asm/main
  src_path: src/main
  build_path: build

  ld_script_path: build/generated/main.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x8005C2F8

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/symbols.txt

  undefined_funcs_auto_path: build/generated/undefined_funcs_auto_main.txt
  undefined_syms_auto_path: build/generated/undefined_syms_auto_main.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: header
    type: header
    start: 0x0

  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x25FC8
    align: 4
    subalign: 4
    subsegments:
      # psylink places .rdata ahead of .text
      - [0x800, .rodata, game]
      - [0xB0C, .rodata, psyq]
      - [0x16BC, asm, crt0]
      - [0x1780, c, game]
      - [0x11198, c, psyq]
      - [0x2F1D8, data, game]
      # libgte sine/cosine tables, referenced by rsin/rcos
      - [0x44830, data, gte_tables]
      - [0x45B94, data, game_2]
      - [0x45CE0, data, psyq]
      - [0x4CAF8, data, game_3]
      - { start: 0x4CC80, type: bss, vram: 0x8005C480, name: game }
      - { start: 0x6ECD0, type: bss, vram: 0x8007E4D0, name: psyq }

  # psylink stores .bss in the file as zeros because a later section follows
  # it: a 320x480 16-bit TIM at 0x800A4CB4, loaded together with the program
  - name: tail
    type: bin
    start: 0x72C48
    vram: 0x80082448
    subalign: 4

  - [0xE0800]
