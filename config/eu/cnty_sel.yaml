segments:
  # not split into the USA version's files yet: its rodata, code and data
  - name: cnty_sel
    type: code
    start: 0x0
    vram: 0x80082CB0
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, cnty_sel]
      - [0x38, asm, cnty_sel]
      - [0x1710, data, cnty_sel]
  # the file does not end on a word, which splat's data segment would pad
