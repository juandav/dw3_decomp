  target_path: disks/eu/AAA/PRO/CNTY_SEL.PRO
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/cnty_sel
  src_path: src/cnty_sel
  asset_path: asm/eu/cnty_sel/bin
