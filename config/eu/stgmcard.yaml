# Digimon World 2003, Europe (SLES-03936): stgmcard
name: stgmcard
sha1: 925dcb2835f6ac18c3c460f2c99c72d87fcd7db2
options:
  basename: stgmcard
  target_path: disks/eu/AAA/PRO/STGMCARD.PRO
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/stgmcard
  src_path: src/stgmcard
  build_path: build/eu

  ld_script_path: build/eu/generated/stgmcard.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x8005C2F8

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt

  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_stgmcard.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_stgmcard.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  # not split into the USA version's files yet: its rodata, code and data
  - name: stgmcard
    type: code
    start: 0x0
    vram: 0x80082CB0
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, stgmcard]
      - [0x20, asm, stgmcard]
      - [0x53D8, data, stgmcard]
  - [0x5CA0]
