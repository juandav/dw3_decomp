# Digimon World 2003, Europe (SLES-03936): main
name: main
sha1: d1b7e4d646e3a9c2b88fdb25d20b5f7116bbb06d
options:
  basename: main
  target_path: disks/eu/SLES_039.36
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/eu/main
  src_path: src/main
  asset_path: assets/eu
  build_path: build/eu

  ld_script_path: build/eu/generated/main.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x8005CB50

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/eu/symbols.txt

  undefined_funcs_auto_path: build/eu/generated/undefined_funcs_auto_main.txt
  undefined_syms_auto_path: build/eu/generated/undefined_syms_auto_main.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: False

  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: header
    type: header
    start: 0x0

  # Not split into the USA version's files yet: one rodata, text, data and
  # bss segment each, at the addresses crt0 and the USA pairs give
  - name: main
    type: code
    start: 0x800
    vram: 0x80010000
    bss_size: 0x25FC8
    align: 4
    subalign: 4
    subsegments:
      # psylink places .rdata ahead of .text
      - [0x800, rodata, rodata]
      - [0x1688, asm, text]
      - [0x2F5CC, data, data]
      - { start: 0x4D4E8, type: bss, vram: 0x8005CCE8, name: bss }

  # psylink stores .bss in the file as zeros because a later section follows
  # it: a 320x480 16-bit TIM, loaded together with the program
  - name: tail
    type: bin
    start: 0x734B0
    vram: 0x80082CB0
    subalign: 4

  - [0xE1800]
